[project]
name = "voca"
version = "0.1.0"
description = "Vocabulary learning with spaced repetition"
requires-python = ">=3.12"
# Runtime dependencies. Vercel installs from this list (keep requirements.txt in sync for pip users).
dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "SQLAlchemy==2.1.1",
    "Flask-Migrate==4.1.0",
    "alembic==1.20.0",
    "Flask-JWT-Extended==4.7.4",
    "Flask-Limiter==4.1.1",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "tzdata==2026.4",
    "libsql==0.1.11",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py312"
